const BRIEF = JSON.parse(document.getElementById('brief-data').textContent);
const SECTIONS = [['decision','Decision'],['platform','Platform'],['evidence','Evidence'],['comparison','Comparison'],['investigation','Investigation'],['value','Engineering value']];
const SCENARIOS = ['Stable / capable','Stable / incapable','Unstable','Inspection sample'];
const SHORT = {lpbf:'LPBF',waam:'WAAM',ebpbf:'EB-PBF',laser_ded:'Laser DED'};
const state = {section:0,method:'laser_ded',scenario:2,chart:'xbar',build:'D024',compareA:0,compareB:2,category:null,appendix:false};
const $ = selector => document.querySelector(selector);
const esc = value => String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = (value,digits=3) => value==null?'—':Number(value).toFixed(digits);
const cases = () => BRIEF.cases.filter(c=>c.process===state.method);
const current = () => cases().find(c=>c.scenario===state.scenario);
const result = () => current().result;
const profile = () => BRIEF.profiles.find(p=>p.name===state.method);
const selectedBuild = () => result().builds.find(b=>b.build_id===state.build)||result().builds[0];
const options = (items,value) => items.map(([key,label])=>`<option value="${key}" ${String(key)===String(value)?'selected':''}>${esc(label)}</option>`).join('');
const tone = r => r.verdict==='capable'?'good':r.verdict==='not capable'?'bad':'';
const verdict = r => r.verdict==='not assessable'?'Capability withheld':r.verdict==='capable'?'Capable at the entered LSL':'Stable, but not capable';
const decision = r => r.verdict==='not assessable'?'Investigate the signals. Establish a justified stable baseline before drawing a capability conclusion.':r.verdict==='not capable'?'The process is consistent, but its strength margin is insufficient. Plan and validate an improvement.':'Maintain monitoring and confirm the sampling and customer requirements remain applicable.';
const takeaway = r => r.verdict==='not assessable'?'A strength result alone cannot establish capability. The full log contains control-chart signals.':r.verdict==='not capable'?'Stability is not capability. The process repeats consistently, but too close to the customer requirement.':'This sample supports the configured capability conclusion. It does not authorize hardware release.';
const table = (headers,rows) => `<div class="table-scroll"><table class="evidence"><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function metric(label,value,unit='',note='') {return `<div class="metric"><dt>${label}</dt><dd>${value} ${unit?`<small>${unit}</small>`:''}</dd>${note?`<small class="note">${note}</small>`:''}</div>`;}
function scorecard(r) {
 return `<section class="panel scorecard" aria-label="Executive scorecard"><span class="status ${tone(r)}">${r.builds.some(b=>b.flagged)?'Signals require investigation':'No chart signals detected'}</span><h2 class="verdict ${tone(r)}">${verdict(r)}</h2><p class="verdict-note">${r.verdict==='not assessable'?'Cpk and Ppk below are descriptive only. Instability prevents a capability conclusion.':esc(r.reason)}</p><dl class="metrics">${metric('Flagged builds',r.signal_pareto.flagged_builds,`/ ${r.n_builds}`)}${metric('Observed coupon failures',r.n_failures,`/ ${r.n_coupons}`,`${n(r.failure_rate*100,1)}% measured below LSL`)}${metric('Lower Cpk',n(r.cpk),'',r.verdict==='not assessable'?'Descriptive · conclusion withheld':'Within-build variation')}${metric('Lower Ppk',n(r.ppk),'',r.verdict==='not assessable'?'Descriptive · conclusion withheld':'Overall variation')}${metric('Selected method',esc(SHORT[state.method]))}${metric('Customer LSL',BRIEF.lsl,'MPa','Illustrative demonstration requirement')}</dl><p class="decision-message">${decision(r)}</p></section>`;
}
function controlChart(r,kind='xbar',interactive=true) {
 const limits=r[kind],key=kind==='xbar'?'mean':'s',values=r.builds.map(b=>b[key]);
 const low=Math.min(...values,limits.lcl),high=Math.max(...values,limits.ucl),padding=(high-low)*.13||1;
 const min=low-padding,max=high+padding,x=i=>56+i*22.7,y=v=>202-(v-min)/(max-min)*166;
 const ticks=[min,(min+max)/2,max];
 return `<div class="chart-wrap"><svg viewBox="0 0 820 250" role="${interactive?'group':'img'}" aria-label="${kind==='xbar'?'X-bar build mean':'S within-build spread'} chart in MPa"><rect x="52" y="27" width="670" height="181" fill="var(--panel)"/>${ticks.map(t=>`<line x1="52" x2="722" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)" stroke-opacity=".5"/><text x="44" y="${y(t)+4}" text-anchor="end">${n(t,0)}</text>`).join('')}${['lcl','center','ucl'].map(k=>`<line x1="52" x2="722" y1="${y(limits[k])}" y2="${y(limits[k])}" stroke="${k==='center'?'var(--cyan)':'var(--muted)'}" ${k==='center'?'':'stroke-dasharray="5 5"'}/><text x="732" y="${y(limits[k])+4}" class="axis-label">${k==='center'?'CL':k.toUpperCase()} ${n(limits[k],1)}</text>`).join('')}<polyline points="${values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--cyan)" stroke-width="1.7"/>${r.builds.map((b,i)=>`<circle cx="${x(i)}" cy="${y(b[key])}" r="${interactive&&b.build_id===state.build?5.5:3.5}" fill="${b.flagged?'var(--amber)':'var(--cyan)'}" ${interactive?`class="point ${b.build_id===state.build?'selected':''}" tabindex="0" role="button" data-build="${esc(b.build_id)}" aria-label="${esc(b.build_id)}, ${kind==='xbar'?'mean':'S'} ${n(b[key])} MPa. ${esc(b.reason||'No detected signal')}. Inspect build."`:''}><title>${esc(b.build_id)} · ${n(b[key])} MPa · ${esc(b.reason||'No detected signal')}</title></circle>`).join('')}<text x="55" y="230">${esc(r.builds[0].build_id)}</text><text x="383" y="230" text-anchor="middle">Build sequence / MPa</text><text x="716" y="230" text-anchor="end">${esc(r.builds.at(-1).build_id)}</text></svg></div>`;
}
function histogram(r) {
 const bins=r.histogram,lo=Math.min(bins[0].lower,BRIEF.lsl)-5,hi=Math.max(bins.at(-1).upper,BRIEF.lsl)+5;
 const x=v=>55+(v-lo)/(hi-lo)*670,max=Math.max(...bins.map(b=>b.count)),y=v=>203-v/max*165;
 return `<div class="chart-wrap"><svg viewBox="0 0 820 250" role="group" aria-label="Coupon strength distribution; bins supplied by the backend"><line x1="55" x2="725" y1="203" y2="203" stroke="var(--rule)"/><text x="45" y="45" text-anchor="end">${max}</text><text x="45" y="206" text-anchor="end">0</text>${bins.map(b=>`<rect class="point" tabindex="0" role="img" aria-label="${n(b.lower,1)} to ${n(b.upper,1)} MPa: ${b.count} coupons" x="${x(b.lower)+1}" y="${y(b.count)}" width="${Math.max(1,x(b.upper)-x(b.lower)-2)}" height="${203-y(b.count)}" fill="var(--cyan)" fill-opacity=".65" data-bin="${n(b.lower,1)}–${n(b.upper,1)} MPa · ${b.count} coupons"><title>${n(b.lower,1)}–${n(b.upper,1)} MPa: ${b.count} coupons</title></rect>`).join('')}<line x1="${x(BRIEF.lsl)}" x2="${x(BRIEF.lsl)}" y1="25" y2="204" stroke="var(--red)" stroke-width="2"/><text x="${x(BRIEF.lsl)+7}" y="20" class="axis-label">LSL ${BRIEF.lsl} MPa</text>${[lo,(lo+hi)/2,hi].map(v=>`<text x="${x(v)}" y="227" text-anchor="middle">${n(v,0)}</text>`).join('')}<text x="390" y="247" text-anchor="middle">Individual coupon UTS / MPa</text></svg></div>`;
}
function bars(p,kind) {
 if(!p.categories.length)return `<div class="empty"><h3>${kind==='inspection'?'No recorded inspection defects in this input':'No control-chart signals to rank'}</h3><p>${kind==='inspection'?'The selected strength dataset does not supply inspection results. A separate synthetic inspection sample is available for this method.':'The backend detected no implemented point-outside-limit signals. This is distinct from a capability or acceptance decision.'}</p>${kind==='inspection'?'<button class="subtle" data-action="inspection">View inspection sample</button>':''}</div>`;
 return `<div class="pareto-bars">${p.categories.map((c,i)=>`<button class="pareto-bar" data-category="${i}" aria-pressed="${state.category===i}"><span class="pareto-label">${esc(c.label)}</span><span class="pareto-track"><i style="width:${c.percent}%"></i></span><span class="pareto-value"><strong>${c.count} · ${n(c.percent,1)}%</strong>cum. ${n(c.cumulative_percent,1)}%</span></button>`).join('')}</div><p class="pareto-footer">Denominator: ${esc(p.denominator)}. Cumulative share measures frequency, not severity or causal contribution.</p>`;
}
function inspector(r) {
 const b=selectedBuild(),p=state.chart==='inspection'?r.inspection_pareto:r.signal_pareto,c=p.categories[state.category];
 return `<aside class="inspector" aria-label="Selected evidence"><span class="status ${b.flagged?'':'good'}">${b.flagged?'Build signal':'No detected signal'}</span><h3>${esc(b.build_id)}</h3><p>${esc(b.order)}</p><dl><div><dt>Build mean</dt><dd>${n(b.mean)} MPa</dd></div><div><dt>Within-build S</dt><dd>${n(b.s)} MPa</dd></div></dl><p>${esc(b.reason||'No point-outside-limit signal detected. This does not alone establish capability.')}</p>${c?`<p class="fine">Selected ${esc(c.label)}: ${esc(c.build_ids.join(', '))}</p>`:''}<button class="button" data-action="inspect">Inspect source records</button><p class="fine" style="margin-top:14px">Use hover or focus for exact chart details. Select a point or Pareto category to trace evidence.</p></aside>`;
}
function comparisonCard(index,side) {
 const c=cases().find(c=>c.scenario===index),r=c.result;
 return `<article class="panel compare-card"><label>${side==='A'?'Reference case':'Comparison case'}<select id="compare-${side}" aria-label="${side==='A'?'Reference':'Comparison'} scenario">${options(SCENARIOS.map((s,i)=>[i,s]),index)}</select></label><h3 class="verdict ${tone(r)}">${verdict(r)}</h3><p class="fine">${r.verdict==='not assessable'?'Cpk/Ppk descriptive only; capability conclusion withheld.':esc(r.reason)}</p><div class="chart-caption"><span>Independent y-axis scale / MPa</span><span>Full-log limits</span></div>${controlChart(r,'xbar',false)}<table class="comparison-table"><tbody>${[['Flagged builds',`${r.signal_pareto.flagged_builds} / ${r.n_builds}`],['Lower Cpk / Ppk',`${n(r.cpk)} / ${n(r.ppk)}`],['Observed coupon failures',`${r.n_failures} / ${r.n_coupons} (${n(r.failure_rate*100,1)}%)`],['Customer LSL',`${BRIEF.lsl} MPa`]].map(([k,v])=>`<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join('')}</tbody></table><p class="decision-message">${decision(r)}</p><p class="source-note">${esc(c.dataset)}.csv</p></article>`;
}
function appendix() {
 return `<details id="technical-appendix" ${state.appendix?'open':''}><summary>Technical appendix · methodology, provenance and limitations</summary><div class="technical-grid"><section><h3>Method and decision rules</h3><p>X-bar/S charts use equal-size build subgroups. Three-sigma limits are calculated from the complete input log. Lower Cpk uses within-build variation; lower Ppk uses overall variation. A capability conclusion requires usable variation, no chart signals and at least ${BRIEF.min_builds} builds; the configured Cpk target is ${BRIEF.cpk_target}.</p><p>The API also returns a pooled Shapiro–Wilk diagnostic and histogram. These do not establish within-build normality or cause. Rational subgrouping, independence, comparable material/orientation/heat treatment and a suitable measurement system require engineering review.</p><h3>Interpretation boundaries</h3><p>Control limits describe process variation; the customer LSL defines individual-coupon conformance. No upper strength specification is modeled. Diagnostic Cpk/Ppk remain visible when capability is withheld. Full-log limits include signaled builds and are not a qualified prospective baseline.</p><p>Signal occurrences can exceed unique flagged builds. Inspection shares use recorded primary-defect coupons only. <code>none</code> records no defect; a blank is unrecorded. A single primary category cannot capture all defects or severity.</p></section><section><h3>Exact snapshot provenance</h3><p>${esc(BRIEF.mode)}</p><p>Captured: <code>${esc(BRIEF.captured_at)}</code><br>Analysis/data commit:<br><code>${esc(BRIEF.revision)}</code><br>Verified origin/main at capture:<br><code>${esc(BRIEF.origin_main)}</code></p><p>Current dataset: <code>${esc(current().dataset)}.csv</code><br>SHA-256: <code>${esc(current().sha256)}</code></p><p>All 16 responses were produced by FastAPI <code>POST /analyze</code> in-process and checked against the existing Python engine. Source and CSV hashes are embedded. JavaScript only formats responses and draws geometry; it performs no QC analysis.</p><h3>Reproduce</h3><pre>python demo/brief_source/build_brief.py --capture\npython demo/brief_source/build_brief.py --check\npython -m pytest tests/test_engineering_brief.py</pre><p>Dashboard link: <a href="${esc(BRIEF.dashboard_url)}" target="_blank" rel="noopener">${esc(BRIEF.dashboard_url)}</a>. It opens a separate application; this snapshot never contacts it. The default is a local preview, not a verified public deployment.</p></section></div><p class="boundary">Decision support only. No causal proof, approved operating window, flightworthiness determination or product-release authority is established by this presentation.</p></details>`;
}
function pageContent(index) {
 const c=current(),r=c.result,b=selectedBuild();
 if(index===0)return `<div class="decision-grid"><section class="decision-copy"><h1>Strength results.<br>A defensible decision.</h1><p class="lead">Titanium 3D-printed brackets are failing customer strength tests. Determine whether the process is consistent, whether strength margin is sufficient, and which records need investigation.</p><p>${takeaway(r)}</p><div class="chart-caption"><span>X-bar / build mean</span><span>Full-log statistical control limits</span></div>${controlChart(r,'xbar',false)}<p class="source-note">${esc(c.dataset)}.csv · ${r.n_builds} builds × ${r.n_per_build} coupons · synthetic example</p></section>${scorecard(r)}</div>`;
 if(index===1)return `<div class="page-heading"><h2>One quality workflow.<br>Four implemented processes.</h2><p>Process-specific context surrounds one shared Python statistical engine. The required measurement stays the same: coupon tensile strength.</p></div><div class="flow"><article><h3>Select the process</h3><p>Use the manufacturing method that produced the measurements.</p></article><article><h3>Provide the evidence</h3><p>Build ID, build date, coupon UTS in MPa and the customer LSL.</p></article><article><h3>Assess quality</h3><p>Stability, lower capability, measured failures and supporting distributions.</p></article><article><h3>Investigate the records</h3><p>Trace signals to builds, coupons and available process parameters.</p></article></div><div class="profiles">${BRIEF.profiles.map(p=>`<article class="profile"><h3>${esc(SHORT[p.name])}</h3><p>${esc(p.label)}</p><small>Implemented · three strength scenarios + inspection sample</small><p style="margin-top:12px">${p.parameters.map(v=>esc(v.label)).join(' · ')}</p></article>`).join('')}</div><p class="fine">Other printing methods and predictive process models are future scope, not implemented support. Profile selection does not validate a sampling design or establish a universal titanium strength threshold.</p>`;
 if(index===2){
  const isPareto=['signals','inspection'].includes(state.chart),p=state.chart==='inspection'?r.inspection_pareto:r.signal_pareto;
  const chartTitles={xbar:'Build mean / X-bar',s:'Within-build spread / S',distribution:'Individual coupon strength',signals:'Control-chart signal evidence',inspection:'Recorded primary inspection defects'};
  return `<div class="page-heading"><h2>Separate the signal<br>from the specification.</h2><p>Inspect exact values and follow the evidence to source records. All limits and summaries describe the complete selected dataset.</p></div><div class="inline-summary"><span class="status ${tone(r)}">${verdict(r)}</span><span>Flagged builds <strong>${r.signal_pareto.flagged_builds}/${r.n_builds}</strong></span><span>Observed failures <strong>${r.n_failures}/${r.n_coupons}</strong></span><span>Cpk / Ppk <strong>${n(r.cpk)} / ${n(r.ppk)}</strong>${r.verdict==='not assessable'?' · descriptive':''}</span></div><div class="evidence-layout"><section class="panel evidence-panel"><div class="chart-tabs" aria-label="Evidence charts">${[['xbar','X-bar'],['s','S chart'],['distribution','Distribution'],['signals','Signal Pareto'],['inspection','Inspection Pareto']].map(([key,label])=>`<button data-chart="${key}" aria-pressed="${state.chart===key}">${label}</button>`).join('')}</div><h3>${chartTitles[state.chart]}</h3>${isPareto?bars(p,state.chart):state.chart==='distribution'?histogram(r):controlChart(r,state.chart==='s'?'s_chart':'xbar')}<div class="chart-readout" id="chart-readout" aria-live="polite">${isPareto?'Select a category to trace its affected builds.':'Hover or focus a chart mark for its exact values.'}</div>${state.chart==='inspection'&&r.inspection_pareto.provided?`<p class="fine">Coverage ${n(p.coverage_percent,1)}% · ${p.inspected_coupons}/${p.total_coupons} recorded · ${p.no_defect_coupons} explicit none · ${p.unrecorded_coupons} unrecorded · ${p.defective_coupons} primary defects</p>`:''}<div class="legend">${isPareto?'<span>Shares and cumulative percentages supplied by Python</span>':state.chart==='distribution'?'<span><i></i>Coupon count</span><span><i class="spec"></i>Customer LSL / individual coupons</span>':'<span><i></i>Build trace / center line</span><span><i class="limit"></i>Statistical limits</span><span><i class="signal"></i>Signal on either chart</span>'}</div><p class="source-note">${esc(c.dataset)}.csv · ${state.chart==='inspection'?'Inspection labels are independent synthetic assignments, not inferred from strength.':'Customer LSL is not a statistical control limit.'}</p></section>${inspector(r)}</div>`;
 }
 if(index===3)return `<div class="page-heading"><h2>Three conditions.<br>Three different responses.</h2><p>Compare the same printing method and customer LSL across independent synthetic scenarios. Each case retains its own full-log control limits.</p></div><div class="two-col">${comparisonCard(state.compareA,'A')}${comparisonCard(state.compareB,'B')}</div><p class="fine" style="margin-top:16px">These are alternative demonstration conditions, not a validated before/after intervention. A difference between scenarios is not a measured improvement or causal effect.</p>`;
 if(index===4){
  const rows=c.records.map((record,i)=>({...record,row:i+1})).filter(record=>record.build_id===b.build_id);
  const context=r.parameters.flagged_builds.find(v=>v.build_id===b.build_id);
  const params=profile().parameters.filter(p=>context&&p.column in context.values);
  const actions=r.investigation_actions.filter(a=>!a.build_ids.length||a.build_ids.includes(b.build_id)).slice(0,4);
  return `<div class="page-heading"><h2>Trace the build.<br>Frame the investigation.</h2><p>Recorded conditions identify questions worth checking. They do not prove a physical cause or prescribe a machine adjustment.</p></div><div class="investigation-grid"><section><label class="build-select">Build under review<select id="build-select">${options(r.builds.map(v=>[v.build_id,`${v.build_id} · ${v.order}${v.flagged?' · signal':''}`]),b.build_id)}</select></label><span class="status ${b.flagged?'':'good'}">${b.flagged?'Control-chart signal present':'No point-outside-limit signal detected'}</span>${table(['Build','Mean / MPa','S / MPa','Evidence'],[[b.build_id,n(b.mean),n(b.s),b.reason||'No detected signal']])}<h3>Source coupon records</h3>${table(['Data row','UTS / MPa','Primary defect'],rows.map(v=>[v.row,n(v.uts_mpa),Object.hasOwn(v,'primary_defect')?(v.primary_defect||'Unrecorded'):'Not supplied']))}<h3>Recorded process context</h3>${params.length?table(['Parameter / unit','Build average','Observed unflagged range'],params.map(p=>{const range=r.parameters.usual_range[p.column];return[`${p.label} / ${p.unit}`,n(context.values[p.column]),range?`${n(range.min)}–${n(range.max)}`:'Unavailable'];})): '<p class="fine">The backend provides comparative parameter summaries for flagged builds. No flagged-build context is available for this selection.</p>'}<p class="fine">Ranges are descriptive observations from unflagged builds, not approved operating windows. Review specimen preparation, test conditions, material lots, orientation and post-processing as possible contributors.</p></section><aside class="panel"><h3>Recommended investigation checks</h3><ul class="checks">${actions.map(a=>`<li><strong>${esc(a.title)}</strong><small>${esc(a.evidence)}</small><p>${esc(a.action)}</p></li>`).join('')}</ul><p class="source-note">Deterministic backend guidance · full-log evidence unless build IDs are specified</p></aside></div>`;
 }
 return `<div class="page-heading"><h2>A clearer quality decision.<br>A more focused engineering review.</h2><p>${takeaway(r)}</p></div><div class="value-columns"><section><h3>For the quality engineer</h3><ul><li>Distinguish process instability from insufficient strength margin.</li><li>Trace a chart signal to build chronology, measured coupons and available manufacturing records.</li><li>Document the next check and validate a corrective action before revising the monitoring baseline.</li></ul><p class="boundary">Current response: ${decision(r)}</p></section><section><h3>For program management</h3><ul><li>See measured failures and the confidence boundary around a capability conclusion.</li><li>Prioritize engineering review using recorded evidence rather than a single pass/fail count.</li><li>Understand what remains unresolved before making schedule, qualification or customer-acceptance decisions.</li></ul><p class="fine">The brief provides traceability and shared decision context. It makes no quantified savings, causal or production-readiness claim.</p></section></div>${appendix()}`;
}
function chooseBuild(){const r=result();state.build=r.builds.find(b=>b.build_id==='D024'&&b.flagged)?.build_id||r.builds.find(b=>b.flagged)?.build_id||r.builds[0].build_id;state.category=null;}
function render(animate=false){
 $('#method').innerHTML=options(BRIEF.profiles.map(p=>[p.name,SHORT[p.name]+' · '+p.label]),state.method);
 $('#scenario').innerHTML=options(SCENARIOS.map((s,i)=>[i,s]),state.scenario);
 $('#sample-context').textContent=`${current().dataset}.csv · ${result().n_builds} builds / ${result().n_coupons} coupons`;
 $('#sections').innerHTML=SECTIONS.map(([id,label],i)=>`<a href="#${id}" ${state.section===i?'aria-current="page"':''}>${label}</a>`).join('');
 $('#page').innerHTML=pageContent(state.section);$('#page').classList.toggle('turn',animate);
 if(animate){$('#page').getBoundingClientRect();$('#page').classList.remove('turn');requestAnimationFrame(()=>$('#page').classList.add('turn'));}
 $('#previous').disabled=state.section===0;$('#next').disabled=state.section===SECTIONS.length-1;
 $('#position').textContent=`${state.section+1} / ${SECTIONS.length} · ${SECTIONS[state.section][1]}`;
 $('#dashboard').href=BRIEF.dashboard_url;
}
function navigate(index,appendixOpen=false){state.section=Math.max(0,Math.min(SECTIONS.length-1,index));state.appendix=appendixOpen;history.replaceState(null,'','#'+SECTIONS[state.section][0]);render(true);$('#spread').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});if(appendixOpen)$('#technical-appendix').scrollIntoView({block:'start',behavior:'instant'});}
$('#method').addEventListener('change',e=>{state.method=e.target.value;chooseBuild();render();$('#method').focus();});
$('#scenario').addEventListener('change',e=>{state.scenario=Number(e.target.value);chooseBuild();render();$('#scenario').focus();});
$('#previous').onclick=()=>navigate(state.section-1);$('#next').onclick=()=>navigate(state.section+1);
$('#appendix-link').onclick=()=>navigate(5,true);
$('#sections').addEventListener('click',e=>{const link=e.target.closest('a');if(link){e.preventDefault();navigate(SECTIONS.findIndex(([id])=>id===link.hash.slice(1)));}});
$('#page').addEventListener('change',e=>{
 if(e.target.id==='compare-A'||e.target.id==='compare-B'){state[e.target.id==='compare-A'?'compareA':'compareB']=Number(e.target.value);const id=e.target.id;render();document.getElementById(id).focus();}
 if(e.target.id==='build-select'){state.build=e.target.value;render();$('#build-select').focus();}
});
$('#page').addEventListener('click',e=>{
 const chart=e.target.closest('[data-chart]'),point=e.target.closest('[data-build]'),category=e.target.closest('[data-category]'),action=e.target.closest('[data-action]');
 if(chart){state.chart=chart.dataset.chart;state.category=null;render();$(`[data-chart="${state.chart}"]`).focus();}
 if(point){state.build=point.dataset.build;render();$(`[data-build="${state.build}"]`)?.focus();}
 if(category){state.category=Number(category.dataset.category);const p=state.chart==='inspection'?result().inspection_pareto:result().signal_pareto;state.build=p.categories[state.category].build_ids[0];render();$(`[data-category="${state.category}"]`).focus();}
 if(action?.dataset.action==='inspect')navigate(4);
 if(action?.dataset.action==='inspection'){state.scenario=3;chooseBuild();render();$('[data-chart="inspection"]').focus();}
});
function detail(e){const point=e.target.closest('[data-build]'),bin=e.target.closest('[data-bin]'),readout=$('#chart-readout');if(!readout)return;if(point){const b=result().builds.find(v=>v.build_id===point.dataset.build);readout.textContent=`${b.build_id} · ${b.order} · mean ${n(b.mean)} MPa · S ${n(b.s)} MPa · ${b.reason||'No detected signal'}`;}if(bin)readout.textContent=bin.dataset.bin;}
$('#page').addEventListener('mouseover',detail);$('#page').addEventListener('focusin',detail);
$('#page').addEventListener('keydown',e=>{if(e.target.matches('[data-build]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('keydown',e=>{if(e.target.closest('button,a,select,input,textarea,summary,[data-build],[data-bin]')||e.ctrlKey||e.metaKey||e.altKey)return;const keys={ArrowRight:state.section+1,PageDown:state.section+1,ArrowLeft:state.section-1,PageUp:state.section-1,Home:0,End:SECTIONS.length-1};if(e.key in keys){e.preventDefault();navigate(keys[e.key]);}});
window.addEventListener('hashchange',()=>{const i=SECTIONS.findIndex(([id])=>id===location.hash.slice(1));if(i>=0){state.section=i;render(true);}});
window.addEventListener('beforeprint',()=>{
 $('#print-root').innerHTML=SECTIONS.map(([id,title],i)=>`<section class="print-spread"><div class="print-heading"><strong>AeroQual / ${esc(title)}</strong><span>${esc(SHORT[state.method])} · ${esc(SCENARIOS[state.scenario])} · LSL ${BRIEF.lsl} MPa</span></div>${pageContent(i)}<p class="source-note">Synthetic snapshot · source commit ${esc(BRIEF.revision)} · ${esc(current().dataset)}.csv · ${i+1}/${SECTIONS.length}</p></section>`).join('');
 $('#print-root').querySelectorAll('details').forEach(d=>d.open=true);
 $('#print-root').querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
});
window.addEventListener('afterprint',()=>$('#print-root').replaceChildren());$('#print-brief').onclick=()=>window.print();
const initial=SECTIONS.findIndex(([id])=>id===location.hash.slice(1));if(initial>=0)state.section=initial;
chooseBuild();render();
</script></body></html>
