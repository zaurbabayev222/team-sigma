>'use strict';
const DATA = JSON.parse(document.getElementById('deck-data').textContent);
const titles = ['Start with a quality question','Choose a printing method','Understand the inputs','Read the three answers','Explore control charts','Read the signal Pareto','Read inspection defects','Keep the baseline fixed','Follow the evidence','Experiment with the LSL','Try your own CSV','Check your understanding','Reproduce and review','What remains to do'];
const state = {slide:0,process:'lpbf',scenario:0,lsl:'895',window:'all',category:null,point:0};
const labels = {lpbf:'Laser powder bed fusion (LPBF)',waam:'Wire arc additive manufacturing (WAAM)',ebpbf:'Electron beam powder bed fusion (EB-PBF)',laser_ded:'Powder-fed laser DED'};
const scenarios = ['Stable / capable','Stable / incapable','Unstable shift','Inspection example'];
const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (value,digits=3) => value == null ? 'Unavailable' : Number(value).toFixed(digits);
const chosen = () => DATA.cases.filter(c=>c.process===state.process)[state.scenario];
const demo = () => DATA.cases.find(c=>c.dataset==='laser_ded_inspection_demo').result;
const note = text => `<div class="note">${text}</div>`;
const table = (heads,rows) => `<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const select = (id,label,options,value) => `<label>${label}<select id="${id}">${options.map(([v,t])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
const processSelect = () => select('process','Printing method',Object.entries(labels),state.process);
function answers(r){return table(['Question','Captured answer','How to read it'],[
 ['Is the process stable?',r.builds.some(b=>b.flagged)?'Chart signals present':'No chart signals detected','No detected signals is not proof of permanent stability.'],
 ['Is capability assessable?',r.verdict,r.reason],
 ['What was measured below LSL?',`${r.n_failures} / ${r.n_coupons} (${num(r.failure_rate*100,1)}%)`,'Observed sample failures; not a predicted population failure probability.'],
 ['Lower Cpk / Ppk',`${num(r.cpk)} / ${num(r.ppk)}`,'Within-build / overall variation. Diagnostic indices remain visible when a verdict is withheld.']]);}
function chart(r,kind){
 const key=kind==='mean'?'xbar':'s_chart',lim=r[key],vals=r.builds.map(b=>b[kind]);
 const low=Math.min(...vals,lim.lcl),high=Math.max(...vals,lim.ucl),pad=(high-low)*.12||1;
 const y=v=>190-(v-low+pad)/(high-low+2*pad)*160,x=i=>48+i*20;
 return `<div class="plot"><svg viewBox="0 0 700 235" role="img" aria-label="${kind==='mean'?'X-bar build means':'S chart build standard deviations'} in MPa; exact values in point selector below"><rect x="45" y="18" width="595" height="178" fill="#f5f8f9"/>${['lcl','center','ucl'].map(k=>`<line x1="45" x2="640" y1="${y(lim[k])}" y2="${y(lim[k])}" stroke="${k==='center'?'#126b76':'#a55422'}" stroke-dasharray="${k==='center'?'0':'5 4'}"/><text x="645" y="${y(lim[k])+4}">${k.toUpperCase()}</text>`).join('')}<polyline points="${vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="#80979f"/>${r.builds.map((b,i)=>`<circle cx="${x(i)}" cy="${y(b[kind])}" r="${i===state.point?6:3.5}" fill="${b.flagged?'#a55422':'#126b76'}"><title>${esc(b.build_id)}: ${num(b[kind])} MPa</title></circle>`).join('')}<text x="48" y="218">${esc(r.builds[0].build_id)}</text><text x="590" y="218">${esc(r.builds.at(-1).build_id)}</text></svg></div>`;
}
function pareto(p){
 return p.categories.length? p.categories.map((c,i)=>`<button type="button" class="bar" data-category="${i}" aria-pressed="${state.category===i}"><span>${esc(c.label)}</span><span class="bar-track"><span class="bar-fill" style="width:${c.percent}%"></span></span><small>${c.count} · ${num(c.percent,1)}% · cumulative ${num(c.cumulative_percent,1)}%</small></button>`).join(''):'<p>No occurrences in this captured view.</p>';
}
function lesson(i){
 const r=chosen().result,d=demo();
 switch(i){
 case 0:return `<p class="lead">Walk from a tensile-test log to a defensible quality conversation.</p><p>AeroQual helps titanium additive manufacturing quality engineers separate process stability, lower-specification capability and observed coupon failures. This tutorial takes about 10–15 minutes; explore the examples at your own pace.</p><ol><li>Pick a printing method and a synthetic dataset.</li><li>Read the control charts before drawing a capability conclusion.</li><li>Use Pareto categories and source records to choose what to investigate.</li></ol>${note('<strong>Training mode:</strong> every number here is a captured response from the existing Python API. This deck works offline and does not analyze uploads. Use “Open local app” to run the real dashboard alongside it.')}<p>All examples are deliberately synthetic. They demonstrate the workflow; they do not qualify a material, machine or aerospace component.</p>`;
 case 1:return `<p class="lead">The statistical engine stays the same. The recorded process context changes.</p><div class="controls">${processSelect()}${select('scenario','Synthetic scenario',scenarios.map((t,i)=>[i,t]),state.scenario)}<button id="download">Download this CSV</button></div><p><strong>${esc(chosen().dataset)}.csv</strong> · 30 builds × 3 coupons · LSL 895 MPa</p>${answers(r)}<p>In the real app, choose the method first, then choose the built-in scenario and analyze. Compare stable/capable, stable/incapable and unstable before opening the inspection example.</p>${note('A method choice selects relevant parameter labels and investigation context. It does not train a strength predictor or establish a universal strength requirement.')}`;
 case 2:return `<p class="lead">One coupon per row. One build per subgroup.</p>${table(['Input','Meaning','Required?'],[['build_id','Identifier shared by coupons from the same build','Yes'],['build_date','Chronological build order; use ISO YYYY-MM-DD for date filtering','Yes'],['uts_mpa','Measured ultimate tensile strength, MPa','Yes'],['LSL','Customer lower strength specification in MPa','Entered separately'],['Process parameters','Method-specific recorded settings; see the data codebook','Optional context'],['primary_defect','One primary inspection category per coupon','Optional']])}<p>Use equal subgroup sizes, at least two coupons per build and at least two builds for calculation. A capability verdict requires at least 25 builds. The examples contain 30 × 3.</p>${note('Use comparable material, orientation, heat treatment and test conditions. Independence, rational subgroups and suitable distribution assumptions matter. A CSV is not a substitute for a measurement-system study.')}<p><code>none</code> means inspected with no recorded defect; a blank is unrecorded. Neither field establishes whether UTS passes the LSL.</p>`;

function go(index){state.slide=Math.max(0,Math.min(titles.length-1,index));state.category=null;location.hash=String(state.slide+1);render();document.querySelector('#lesson').focus();window.scrollTo(0,0);}
function render(){
 const i=state.slide;document.getElementById('content').innerHTML=`<h1>${titles[i]}</h1>${lesson(i)}`;
 document.getElementById('outline').innerHTML=titles.map((t,j)=>`<a href="#${j+1}" ${i===j?'aria-current="step"':''}>${j+1}. ${t}</a>`).join('');
 document.getElementById('position').textContent=`${i+1} / ${titles.length}`;
 document.getElementById('previous').disabled=i===0;document.getElementById('next').disabled=i===titles.length-1;
 for(const [id,key] of [['process','process'],['scenario','scenario'],['lsl','lsl'],['window','window'],['point','point']])document.getElementById(id)?.addEventListener('change',e=>{state[key]=['scenario','point'].includes(key)?Number(e.target.value):e.target.value;state.category=null;render();document.getElementById(id)?.focus();});
 document.getElementById('download')?.addEventListener('click',()=>{const c=chosen(),a=document.createElement('a'),url=URL.createObjectURL(new Blob([new TextEncoder().encode(c.csv)],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=c.dataset+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
 document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{state.category=Number(b.dataset.category);render();document.querySelector(`[data-category="${state.category}"]`).focus();}));
 document.querySelectorAll('[data-quiz]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('feedback-'+b.dataset.quiz).textContent=(b.dataset.correct==='true'?'Correct. ':'Try again. ')+b.dataset.feedback;}));
}
document.getElementById('previous').onclick=()=>go(state.slide-1);document.getElementById('next').onclick=()=>go(state.slide+1);
window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=titles.length){state.slide=n-1;state.category=null;render();document.querySelector('#lesson').focus();}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,button,a,summary')||e.altKey||e.ctrlKey||e.metaKey)return;const moves={ArrowRight:state.slide+1,ArrowLeft:state.slide-1,PageDown:state.slide+1,PageUp:state.slide-1,Home:0,End:titles.length-1};if(e.key in moves){e.preventDefault();go(moves[e.key]);}});
window.addEventListener('beforeprint',()=>{document.getElementById('print-root').innerHTML=titles.map((t,i)=>`<section class="print-lesson"><h1>${i+1}. ${t}</h1>${lesson(i)}</section>`).join('');document.querySelectorAll('#print-root details').forEach(d=>d.open=true);});
window.addEventListener('afterprint',()=>document.getElementById('print-root').replaceChildren());
document.getElementById('print').onclick=()=>window.print();
const initial=Number(location.hash.slice(1));if(initial>=1&&initial<=titles.length)state.slide=initial-1;
if(window.matchMedia('(max-width:850px)').matches)document.querySelector('aside details').open=false;
render();
</script></body></html>
