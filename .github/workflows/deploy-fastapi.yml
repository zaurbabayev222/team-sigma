# Adapted from .claude/skills/connect-publish/workflows/deploy-fastapi.yml
# and its React static sibling (MIT, timothyfraser/fastapi-connect-demo).
# Local changes preserve app.* imports, bundle demo data/UI, verify checksums,
# and require a manually confirmed target. CI never regenerates the manifest.
name: Validate and deploy AeroQual

on:
  push:
    branches: [main]
    paths: ['app/**', 'data/**', 'demo/**', 'tests/**', '.github/**']
  pull_request:
    paths: ['app/**', 'data/**', 'demo/**', 'tests/**', '.github/**']
  workflow_dispatch:
    inputs:
      confirmed_target_title:
        description: 'Exact existing Connect title, after reviewing code and target'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-fastapi-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: 'app'
  CONTENT_NAME: 'sigma-airlines-aeroqual'
  CONTENT_GUID: ${{ vars.CONNECT_CONTENT_GUID }}
  NODE_VERSION: '22'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ${{ env.APP_DIR }}/.python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json
      - name: Test and build the dashboard
        working-directory: ${{ env.APP_DIR }}/frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Stage the exact committed manifest and verify every checksum
        run: |
          python .github/scripts/test_connect_bundle.py -v
          python .github/scripts/prepare-connect-bundle.py --output "$RUNNER_TEMP/aeroqual-bundle"
      - name: Test core statistics, all demo datasets and the actual bundle HTTP API
        run: |
          python -m pip install -r "$RUNNER_TEMP/aeroqual-bundle/requirements.txt"
          bash "$APP_DIR/sync_data.sh"
          python -m pytest tests app/test_api.py
          python demo/check.py
          python .github/scripts/verify-connect-app.py --bundle "$RUNNER_TEMP/aeroqual-bundle"

  deploy:
    # Pushes/PRs validate only. The human supplies a confirmed title to publish.
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIRMED_CONTENT_TITLE: ${{ inputs.confirmed_target_title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ${{ env.APP_DIR }}/.python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/frontend/package-lock.json
      - name: Rebuild the dashboard and verify the committed bundle
        run: |
          npm --prefix "$APP_DIR/frontend" ci --no-audit --no-fund
          npm --prefix "$APP_DIR/frontend" run build
          python .github/scripts/prepare-connect-bundle.py --output "$RUNNER_TEMP/aeroqual-bundle"
          python -m pip install -r "$RUNNER_TEMP/aeroqual-bundle/requirements.txt"
      - name: Read the target and require its confirmed title and public access
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
        run: python .github/scripts/preflight-connect.py
      - name: Publish the verified bundle without regenerating the manifest
        id: publish
        timeout-minutes: 10
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          BUNDLE_DIR: ${{ runner.temp }}/aeroqual-bundle
          POLL_BUDGET_SECONDS: '120'
        run: bash .github/scripts/connect-publish-async.sh
      - name: Verify the public dashboard, health and SPEC known answer without authentication
        env:
          CONTENT_URL: ${{ steps.publish.outputs.content_url }}
        run: python .github/scripts/verify-connect-app.py --url-env CONTENT_URL --attempts 20
      - name: Reproduce all three scenarios against the public API
        env:
          CONTENT_URL: ${{ steps.publish.outputs.content_url }}
        run: python demo/check.py --base-url "$CONTENT_URL"
